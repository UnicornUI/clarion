[package]
name = "clarion-settings"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native GPUI system settings for the Clarion desktop"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { workspace = true, features = ["string"] }
clarion-preferences = { path = "../clarion-preferences" }
clarion-ipc = { path = "../clarion-ipc" }
clarion-config = { path = "../clarion-config" }
clarion-settings-core = { path = "../clarion-settings-core" }
gpui = { version = "=0.2.2", default-features = false, features = ["wayland"] }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.45.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
unicode-segmentation = "1"

[dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "test-support"] }
tempfile = "3"
